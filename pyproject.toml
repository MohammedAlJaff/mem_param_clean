[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem-param"
version = "0.1.0"
description = "Target parameterization and memorization dynamics."
requires-python = ">=3.10"
dependencies = [
  "ml-collections>=0.1.1",
]

[tool.setuptools.packages.find]
include = ["mem_param_src*"]

[tool.ruff.lint]
unfixable = ["F401"]
